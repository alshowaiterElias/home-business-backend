version: '3.8'

services:
  app:
    build: .
    container_name: home-business-api
    ports:
      - "5000:5000"
    volumes:
      - ./uploads:/usr/src/app/uploads
    env_file:
      - .env
    restart: always
    environment:
      - NODE_ENV=production
